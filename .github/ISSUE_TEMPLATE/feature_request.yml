name: Feature request / 機能提案
description: 何を実現したいか提案する
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 困っていること
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 希望する動作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 代替案・対象環境
