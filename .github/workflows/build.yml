name: Build and check Windows preview

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate PowerShell script syntax
        shell: powershell
        run: ./tools/check-scripts.ps1
      - name: Build application
        shell: powershell
        run: ./tools/build.ps1
      - name: Run offline core checks
        shell: powershell
        run: |
          $check = Start-Process -FilePath (Resolve-Path dist/CraftHarbor.exe) -ArgumentList '--core-check' -Wait -PassThru
          Get-Content dist/core-check-report.txt
          if ($check.ExitCode -ne 0) { throw 'Core checks failed.' }
      - name: Check persistent host, pack import and voice configuration
        shell: powershell
        run: ./tools/check-integrations.ps1
      - name: Validate automatic options with installed Java
        shell: powershell
        run: ./tools/check-java.ps1
      - name: Package unsigned preview
        shell: powershell
        run: ./tools/package.ps1
      - name: Check UI using a synthetic workspace
        shell: powershell
        run: |
          ./tools/check-ui.ps1 -Scenario vanilla
          ./tools/check-ui.ps1 -Scenario modpack
          ./tools/check-ui.ps1 -Scenario argfile
      - name: Expose synthetic UI review images
        if: always()
        shell: powershell
        run: ./tools/report-ui.ps1
      - name: Prepare verified Inno Setup compiler
        shell: powershell
        run: ./tools/install-inno.ps1
      - name: Build Windows setup and uninstall launcher
        shell: powershell
        run: ./tools/build-installer.ps1 -CompilerPath ./work/tools/inno/ISCC.exe
      - name: Check setup, uninstall and data retention
        shell: powershell
        run: ./tools/check-installer.ps1
      - name: Validate release versions and assets
        shell: powershell
        run: ./tools/check-release.ps1
      - name: Upload preview artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-x64
          path: |
            dist/CraftHarbor-0.4.0-preview-windows-x64.zip
            dist/CraftHarbor-0.4.0-preview-windows-x64.zip.sha256
            dist/release-manifest.json
            dist/core-check-report.txt
            dist/java-verification.txt
            dist/CraftHarbor-Setup-0.4.0-preview.exe
            dist/CraftHarbor-Setup-0.4.0-preview.exe.sha256
            dist/CraftHarbor-Uninstall-0.4.0-preview.exe
            dist/CraftHarbor-Uninstall-0.4.0-preview.exe.sha256
            work/integration-*/host-verification.txt
            work/integration-*/pack-check/pack-verification.txt
            work/installer-check-*/installer-verification.txt
            work/ui-fixture-*/experience-verification.txt
            work/ui-fixture-*/ui-review-verification.txt
            work/ui-fixture-*/harbor-review-verification.txt
            work/ui-fixture-*/ui-*.png
          if-no-files-found: error
          retention-days: 14

  release-check:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the checked build from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-windows-x64
          path: .
      - name: Validate release publication inputs without API writes
        run: python3 tools/publish-release.py --check-only

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, release-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: craftharbor-release
      cancel-in-progress: false
    steps:
      - name: Checkout the exact checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Download the checked build from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-windows-x64
          path: .
      - name: Publish changed release version after digest verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/publish-release.py
